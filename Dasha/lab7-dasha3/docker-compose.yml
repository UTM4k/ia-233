services:

  web:
    build: ./web
    container_name: web
    ports:
      - "8080:80"
    depends_on:
      - images
      - css
    networks:
      - labnet

  images:
    build: ./images
    container_name: images
    expose:
      - "80"
    networks:
      - labnet

  css:
    build: ./css
    container_name: css
    expose:
      - "80"
    networks:
      - labnet

networks:
  labnet:
    driver: bridge
